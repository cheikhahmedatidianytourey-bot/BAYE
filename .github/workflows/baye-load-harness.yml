name: BAYE bounded load harness
on:
  pull_request:
    paths:
      - 'scripts/baye-load.mjs'
      - '.github/workflows/baye-load-harness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/baye-load.mjs'
      - '.github/workflows/baye-load-harness.yml'
permissions:
  contents: read
jobs:
  offline-self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run synthetic localhost harness test
        run: node scripts/baye-load.mjs --self-test
