name: BAYE automated validation
on:
  push:
    branches:
      - main
      - 'baye-v6-*'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Run automated tests
        run: npm test
      - name: Build web application
        run: npm run build
