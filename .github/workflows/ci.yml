name: BAYE CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: baye
          POSTGRES_PASSWORD: baye_test_password
          POSTGRES_DB: baye_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baye -d baye_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BAYE_TEST_DATABASE_URL: postgresql://baye:baye_test_password@localhost:5432/baye_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm install
      - name: Run backend tests
        run: npm test
      - name: Build frontend
        run: npm run build
