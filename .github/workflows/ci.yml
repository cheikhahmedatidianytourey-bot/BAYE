name: BAYE CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm install
      - name: Run backend tests
        run: npm test
      - name: Build frontend
        run: npm run build
