name: BAYE dependency audit

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: npm install
      - name: Run dependency audit (fail on any vulnerability)
        shell: bash
        run: |
          set +e
          npm audit --audit-level=low --json > audit.json
          audit_status=$?
          cat audit.json
          exit "$audit_status"
